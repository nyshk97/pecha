[tasks.gen]
description = "署名用 xcconfig を用意して XcodeGen で .xcodeproj を生成する（keychain には触らない）"
run = "mkdir -p build && bash scripts/ensure-signing-xcconfig.sh && xcodegen generate --quiet"

[tasks.signing]
description = "keychain の Developer ID から署名用 xcconfig を書き出す（keychain に触る。会社貸与 PC では自分の Terminal で叩く）"
run = "bash scripts/gen-signing-xcconfig.sh && xcodegen generate --quiet"

[tasks.build]
description = "Debug（Pecha Dev）をビルドする"
run = """
set -eo pipefail
mise run gen
# Claude Code のセッション（CLAUDECODE）からは証明書で署名しない（会社貸与 PC で keychain に触らない）。コマンドライン指定は xcconfig より優先される
SESSION_SIGN=""; [ -n "${CLAUDECODE:-}" ] && SESSION_SIGN="CODE_SIGN_IDENTITY=-"
xcodebuild -project pecha.xcodeproj -scheme pecha -configuration Debug -derivedDataPath build $SESSION_SIGN build > build/xcodebuild-debug.log 2>&1 || { grep -E 'error:|\\*\\* BUILD' build/xcodebuild-debug.log | head -40; exit 1; }
grep -E '\\*\\* BUILD' build/xcodebuild-debug.log
"""

[tasks.build-release]
description = "Release（Pecha）をビルドする"
run = """
set -eo pipefail
mise run gen
# Claude Code のセッション（CLAUDECODE）からは証明書で署名しない（会社貸与 PC で keychain に触らない）。コマンドライン指定は xcconfig より優先される
SESSION_SIGN=""; [ -n "${CLAUDECODE:-}" ] && SESSION_SIGN="CODE_SIGN_IDENTITY=-"
xcodebuild -project pecha.xcodeproj -scheme pecha -configuration Release -derivedDataPath build $SESSION_SIGN build > build/xcodebuild-release.log 2>&1 || { grep -E 'error:|\\*\\* BUILD' build/xcodebuild-release.log | head -40; exit 1; }
grep -E '\\*\\* BUILD' build/xcodebuild-release.log
"""

[tasks.test]
description = "単体テスト（Sources/Core の純粋関数）を実行する"
run = """
set -eo pipefail
mise run gen
# Claude Code のセッション（CLAUDECODE）からは証明書で署名しない（会社貸与 PC で keychain に触らない）。コマンドライン指定は xcconfig より優先される
SESSION_SIGN=""; [ -n "${CLAUDECODE:-}" ] && SESSION_SIGN="CODE_SIGN_IDENTITY=-"
xcodebuild -project pecha.xcodeproj -scheme pecha -derivedDataPath build $SESSION_SIGN test > build/xcodebuild-test.log 2>&1 || { grep -E 'error:|failed|\\*\\* TEST' build/xcodebuild-test.log | head -60; exit 1; }
grep -E 'Executed|\\*\\* TEST' build/xcodebuild-test.log | tail -3
"""

[tasks.run]
description = "dev ビルドを /Applications/Pecha Dev.app に置いて起動し直す（既存の dev プロセスは終了させる）"
run = "mise run build && bash scripts/install-app.sh Debug"

[tasks.install]
description = "Release ビルドを /Applications/Pecha.app に置いて起動し直す（配布物の再署名・notarize は通らない。Sparkle の更新経路の確認には mise run release の配布物を使う）"
run = "mise run build-release && bash scripts/install-app.sh Release"

[tasks.log]
description = "dev 版のログを follow する"
run = "tail -f ~/Library/Logs/pecha/pecha-dev.log"

[tasks.log-prod]
description = "常用版のログを follow する"
run = "tail -f ~/Library/Logs/pecha/pecha.log"

[tasks."release:preflight"]
description = "リリース前チェックだけを実行する"
run = "bash scripts/preflight.sh"

[tasks.release]
description = "リリースする（bump → ビルド → 署名 → notarize → GitHub Release → cask 更新）。keychain に触るので会社貸与 PC では自分の Terminal で叩く"
usage = 'arg "[bump]" default="patch" help="patch|minor|major|x.y.z"'
run = "bash scripts/release.sh $usage_bump"

[tasks.transcribe]
description = "dev ビルドに音声ファイルを文字起こしさせて結果を表示する（マイク・ホットキーを使わない。辞書は一時ファイルを指せる）"
usage = '''
flag "--engine <engine>" help="haas か os（省略時はアプリと同じ選び方）"
flag "--model-dir <dir>" help="Pecha/models/ と同じ形のフォルダ（iCloud Drive に触らずに確かめる。コンパイル先は一時フォルダ）"
arg "<audio>" help="音声ファイル（say -v Kyoko -o x.aiff で作れる）"
arg "[dictionary]" default="" help="辞書ファイル（省略時は空の一時ファイル。共有の辞書は読み書きしない）"
'''
run = "mise run build && bash scripts/transcribe-file.sh ${usage_engine:+--engine \"$usage_engine\"} ${usage_model_dir:+--model-dir \"$usage_model_dir\"} \"$usage_audio\" \"$usage_dictionary\""

[tasks.record-samples]
description = "比べる用の例文（scripts/sample-sentences.txt の 6 本・1 分ほど）を 1 文ずつ読み上げて録音し、iCloud Drive の Pecha/samples/ に音声と正しい文を置く（自分の Terminal で。最初にマイクの許可が出る）"
run = "swift -suppress-warnings scripts/record-samples.swift scripts/sample-sentences.txt"

[tasks.compare]
description = "自分の声のサンプル（iCloud Drive の Pecha/samples/）を OS の認識と Haas の両方で文字起こしして並べる（正しい文の .txt があれば違いを数える。本文は画面にだけ出す）"
usage = '''
arg "[samples]" default="" help="サンプルのフォルダ（省略時は iCloud Drive の Pecha/samples/）"
'''
run = "mise run build && python3 -I scripts/compare-engines.py \"$usage_samples\""

[tasks.place-model]
description = "Haas のモデルを Hugging Face から取って iCloud Drive の Pecha/models/ に置き、pecha-model.json をその版にする（版を入れ替えるとき）"
usage = 'arg "<revision>" help="okayuji/Haas-ja-v1.0-CoreML-INT8 のコミット"'
run = "python3 -I scripts/place-haas-model.py \"$usage_revision\""
